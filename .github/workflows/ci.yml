name: MindEase CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Root Dependencies
      run: npm install

    - name: Test & Build Backend
      run: |
        cd backend
        npm ci
        npx prisma generate
        npm test
        npm run build

    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build
